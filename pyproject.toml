[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-vision-model"
version = "0.1.0"
description = "Edge Vision Model - from-scratch nano NMS-free object detector (VOC -> COCO -> CPU deployment)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Avneesh Jadhav" }]
# NOTE: no license declared yet (intentionally omitted until explicitly decided)
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pillow>=10.0",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "torchvision>=0.16"]
aug = ["albumentations>=1.3"]
eval = ["pycocotools>=2.0.7"]
export = ["onnx>=1.15", "onnxsim>=0.4.36"]
ort = ["onnxruntime>=1.17"]
openvino = ["openvino>=2024.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["models*", "losses*", "data*", "engine*", "export*", "benchmarks*", "configs*"]

[tool.setuptools.package-data]
configs = ["*.yaml"]